name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options:
          - all
          - windows
          - linux
        default: all
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-22.04"]' || inputs.platform == 'windows' && '["windows-2022"]' || '["windows-2022","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # Use HTTPS mirrors directly; the runner's Azure HTTP mirror can stall.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils cmake nasm
      - name: Configure Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          choco install nasm --yes --no-progress
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify formatting, lint, types, and tests
        run: pnpm check
      - name: Build release packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: CuteImageSorter v__VERSION__
          releaseBody: Download the Windows installer (.exe or .msi) or Linux package (.AppImage or .deb) below.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ runner.os == 'Windows' && 'nsis,msi' || 'deb,appimage' }}
